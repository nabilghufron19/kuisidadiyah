<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Al-Miftah – Kuis Nahwu</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"></noscript>
<style>
:root{--bg:#F0FAF4;--side:#E3F5EA;--surface:#fff;--ink:#0F2718;--muted:#4D7260;--line:#C5E4CF;--accent:#1A7A3C;--on:#fff;--soft:#D6F0E0;--lime:#2EAD5C;
--body:"Plus Jakarta Sans","Amiri","Segoe UI",system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0A1A10;--side:#061209;--surface:#0E2116;--ink:#E8F5EC;--muted:#7AAF8A;--line:#1A3D24;--accent:#3DC26B;--on:#061209;--soft:#113321;--lime:#3DC26B}}
:root[data-theme=dark]{--bg:#0A1A10;--side:#061209;--surface:#0E2116;--ink:#E8F5EC;--muted:#7AAF8A;--line:#1A3D24;--accent:#3DC26B;--on:#061209;--soft:#113321;--lime:#3DC26B}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.6 var(--body);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input:not([type=checkbox]){font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px;width:100%;margin-bottom:10px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1{font-size:clamp(1.6rem,5vw,2.4rem);line-height:1.1;letter-spacing:-.03em;margin:0 0 8px;font-weight:800}h2{font-size:1.15rem;margin:0 0 10px}
.muted{color:var(--muted);margin:0 0 12px}.err{color:#c0392b;min-height:1.4em;margin-bottom:6px;font-size:.92rem}
.app{display:flex;height:100%}
.side{width:260px;flex:none;background:var(--side);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:8px}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 14px;font-size:1.4rem;font-weight:800}
.logo{width:36px;height:36px;border-radius:12px 12px 12px 4px;background:var(--accent);color:var(--on);display:grid;place-items:center}
.nav{text-align:left;padding:11px 14px;border-radius:12px;font-weight:600}.nav:hover{background:var(--soft)}.nav.active{background:var(--surface);box-shadow:0 1px 0 var(--line)}
.sp{flex:1}.who{padding:0 14px;color:var(--muted);font-size:.9rem}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:none;align-items:center;gap:12px;padding:12px 16px}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line)}
.scroll{flex:1;overflow-y:auto;padding:28px 20px 40px}.wrap{max-width:760px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px 22px 22px 6px;padding:20px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}.grid .card{margin:0}
.tag{display:inline-block;background:var(--lime);color:var(--on);font-size:.8rem;font-weight:700;padding:2px 12px;border-radius:999px;margin-bottom:10px}
.btn{background:var(--accent);color:var(--on);font-weight:700;padding:12px 20px;border-radius:14px}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}.btn:hover:not(:disabled){filter:brightness(1.06)}.btn:disabled{opacity:.4;cursor:not-allowed}
.btn small{display:block;font-weight:500;opacity:.7;font-size:.75rem}
.lv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.lv .btn{padding:10px 4px;text-align:center}
.row{display:flex;gap:10px;justify-content:space-between;margin-top:14px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}.tabs button{padding:8px 16px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:600}
.tabs button.on{background:var(--accent);color:var(--on);border-color:transparent}
.auth{max-width:400px;margin:8vh auto 0}.auth .btn{width:100%}
.bar{height:8px;background:var(--soft);border-radius:9px;overflow:hidden;margin-bottom:14px}.bar i{display:block;height:100%;background:var(--accent);transition:width .2s}
.opt{display:flex;gap:12px;width:100%;text-align:left;padding:13px 16px;margin-bottom:8px;border-radius:16px;border:1px solid var(--line);background:var(--bg)}
.opt:hover{border-color:var(--accent)}.opt.sel{background:var(--soft);border-color:var(--accent)}.opt b{color:var(--accent)}
.chk{display:flex;gap:8px;align-items:center;margin:12px 0;font-size:.92rem}
.lrow{display:grid;grid-template-columns:44px 1fr auto auto;gap:12px;align-items:center;padding:10px 6px;border-bottom:1px solid var(--line)}.lrow:last-child{border:0}
.lrow.me{background:var(--soft);border-radius:12px}.rk{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--bg);font-weight:800}
.r1{background:#F5C518;color:#3a2e00}.r2{background:#C9D1D9;color:#222}.r3{background:#D08B4F;color:#2b1500}
.scrim{display:none}
@media(max-width:820px){.top{display:flex}.side{position:fixed;z-index:30;inset:0 auto 0 0;width:min(300px,86vw);transform:translateX(-100%);transition:transform .25s}
.app.open .side{transform:none}.app.open .scrim{display:block;position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45)}.grid{grid-template-columns:1fr}}
.anon .side,.anon .top{display:none}

/* ===== Animasi & level ===== */
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
@keyframes glow{from{box-shadow:0 0 0 0 rgba(31,157,85,.7)}to{box-shadow:0 0 0 20px rgba(31,157,85,0)}}
@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
@keyframes blink{50%{opacity:0}}
#view>*:not(.grid),.grid>.card,.lrow{animation:rise .5s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0)*70ms)}
.btn,.opt,.nav,.tabs button,.lvl{transition:transform .15s,box-shadow .2s,filter .2s,background .2s,border-color .2s}
.btn:hover:not(:disabled){transform:translateY(-3px);box-shadow:0 10px 22px -10px rgba(20,100,50,.55)}
.btn:active:not(:disabled),.opt:active:not(:disabled),.lvl:active,.nav:active,.tabs button:active{transform:scale(.95)}
.tabs button:hover{transform:translateY(-2px)}
.opt{animation:rise .4s backwards;animation-delay:calc(var(--i,0)*90ms + 300ms)}
.opt:hover:not(:disabled){transform:translateX(6px)}.opt:disabled{cursor:default}
.opt.ok{background:#1f9d55;border-color:#1f9d55;color:#fff;animation:pop .35s,glow .8s}
.opt.no{background:#d64545;border-color:#d64545;color:#fff;animation:shake .45s}
.opt.ok b,.opt.no b{color:#fff}
h2.cur::after{content:'▌';color:var(--accent);animation:blink .8s infinite}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}.meta .muted{margin:0}
.chip{display:inline-block;background:var(--soft);padding:2px 14px;border-radius:999px;font-weight:700}.chip.pop{animation:pop .45s}
.fb{margin-top:12px;padding:12px 16px;border-radius:14px;font-weight:700;animation:pop .35s}
.fb.ok{background:rgba(31,157,85,.15);color:#1f9d55}.fb.no{background:rgba(214,69,69,.15);color:#d64545}
.pt{position:fixed;width:10px;height:10px;border-radius:3px;pointer-events:none;z-index:99;animation:fly .95s ease-out forwards}
.prog{height:10px;background:var(--soft);border-radius:9px;overflow:hidden}.prog i{display:block;width:0;height:100%;background:linear-gradient(90deg,var(--lime),var(--accent));border-radius:9px;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.lvls{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.lvl{position:relative;overflow:hidden;text-align:left;color:#fff;padding:14px 12px 12px;border-radius:18px;display:flex;flex-direction:column;gap:2px;min-height:136px}
.lvl.e{background:linear-gradient(135deg,#2EAD5C,#1A7A3C)}.lvl.m{background:linear-gradient(135deg,#F5A623,#E67E22)}.lvl.h{background:linear-gradient(135deg,#EF5B5B,#B3245B)}
.lvl:hover{transform:translateY(-4px) scale(1.03);box-shadow:0 14px 26px -12px rgba(0,0,0,.45)}
.lvl .ic{font-size:1.7rem;line-height:1;transition:transform .3s}.lvl:hover .ic{transform:scale(1.3) rotate(-10deg)}
.lvl small{opacity:.9}.lvl .xp{margin-top:auto;align-self:flex-start;background:rgba(255,255,255,.24);padding:1px 10px;border-radius:999px;font-weight:800;font-size:.78rem}
.lvl .pb{display:block;height:5px;background:rgba(255,255,255,.3);border-radius:9px;margin-top:8px;overflow:hidden}.lvl .pb u{display:block;height:100%;background:#fff;border-radius:9px}
.lvl .done{position:absolute;top:10px;right:10px}
.lvl::after{content:'';position:absolute;inset:0;background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.3) 50%,transparent 70%);transform:translateX(-130%)}
.lvl:hover::after{transform:translateX(130%);transition:transform .7s}
.res{text-align:center}.res .row{justify-content:center}.big{font-size:3.6rem;line-height:1.2;animation:pop .6s}
.rk.r1,.rk.r2,.rk.r3{background:none;font-size:1.5rem}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* ===== Perbaikan: hover tidak menggeser elemen (mencegah goyang di tepi tombol) ===== */
.btn:hover:not(:disabled),.tabs button:hover,.opt:hover:not(:disabled){transform:none}
.btn:hover:not(:disabled){filter:brightness(1.08);box-shadow:0 8px 20px -10px rgba(20,100,50,.6)}
.tabs button:hover{border-color:var(--accent)}
.opt:hover:not(:disabled){box-shadow:inset 4px 0 0 var(--accent)}
.lvl:hover{transform:scale(1.03)}
.btn:active:not(:disabled),.opt:active:not(:disabled),.lvl:active,.nav:active,.tabs button:active{transform:scale(.97)}
.auth,.auth *{animation:none!important}
/* ===== Warna per jilid (mengikuti sampul buku) ===== */
.jc{border-top:5px solid var(--c)}
.jc .tag{background:var(--c);color:var(--fg,#fff)}
.jc .bar i{background:var(--c)}
.lvl{color:var(--fg,#fff)}
.lvl.e{background:linear-gradient(135deg,color-mix(in srgb,var(--c) 65%,#fff),var(--c))}
.lvl.m{background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 78%,var(--d)))}
.lvl.h{color:#fff;background:linear-gradient(135deg,var(--d),color-mix(in srgb,var(--d) 60%,#000))}
.lvl .xp{white-space:nowrap;padding:1px 8px;font-size:.74rem;background:color-mix(in srgb,currentColor 18%,transparent)}
.lvl .pb{background:color-mix(in srgb,currentColor 25%,transparent)}.lvl .pb u{background:currentColor}
.urow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.urow:last-child{border:0}
.del{padding:8px 16px;color:#c0392b}.nofx .lrow{animation:none}
/* ===== Kredit ===== */
.credit{text-align:center;color:var(--muted);font-size:.8rem;letter-spacing:.02em;line-height:1.4}.credit b{color:var(--accent);font-weight:700}
.scroll{display:flex;flex-direction:column}.wrap{width:100%;flex:1 0 auto}
.scroll>.credit{padding:28px 0 0}.side .credit{text-align:left;padding:8px 14px 0}
@media(min-width:821px){body:not(.anon) .scroll>.credit{display:none}}
/* ===== Logo brand ===== */
.brand{padding:0 4px 14px}.brand img{display:block;width:100%;max-width:210px}
.top-logo{display:block;height:40px;width:auto}
.auth-logo{display:block;width:min(300px,85%);margin:0 auto 12px}
/* ===== Daftar rank ===== */
.ranks{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.rnk{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;padding:12px 4px;border-radius:16px;border:1px solid var(--line);background:var(--bg)}
.rnk .dot{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--soft);color:var(--muted);margin-bottom:4px}
.rnk small{color:var(--muted);font-weight:600}
.rnk.done .dot,.rnk.cur .dot{background:var(--accent);color:var(--on)}
.rnk.cur{border-color:var(--accent);background:var(--soft);box-shadow:inset 0 0 0 1px var(--accent)}.rnk.cur .dot{animation:pop .5s}
.rnk.lock{opacity:.6}
@media(max-width:560px){.ranks{grid-template-columns:1fr}.rnk{flex-direction:row;text-align:left;gap:12px;padding:10px 14px}.rnk .dot{margin:0}.rnk small{margin-left:auto}}
/* ===== Rank liga ===== */
.rnk.done .dot,.rnk.cur .dot{background:var(--rc);color:#1a1a1a;font-size:1.25rem}
.rnk.cur{border-color:var(--rc);background:var(--soft);box-shadow:inset 0 0 0 2px var(--rc)}
.rnk.cur b{color:var(--ink)}
/* ===== Endless ===== */
.endless{display:flex;justify-content:space-between;align-items:center;gap:16px;color:#fff;border:0;background:linear-gradient(135deg,#3b1d8f,#c2317a)}
.endless h2{margin:6px 0 4px}.endless p{margin:0 0 6px;opacity:.92}.endless small{opacity:.9;font-weight:700}
.endless .tag{background:rgba(255,255,255,.22);color:#fff}.endless .btn{background:#fff;color:#3b1d8f;flex:none}
.end{border-top:5px solid #c2317a}.end .meta .chip{font-size:1.05rem}.chip.shk{animation:shake .45s}
@media(max-width:560px){.endless{flex-direction:column;align-items:stretch}}
/* ===== Profil, toast, panduan, tahap Tathbiq ===== */
.av{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;font-size:1.1rem;flex:none}.av.lg{width:84px;height:84px;font-size:2.6rem}
#who{display:flex;align-items:center;gap:10px}#who>span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.un{display:flex;align-items:center;gap:8px;min-width:0}
.prof{display:flex;align-items:center;gap:18px}.prof h1{margin:0 0 6px}.prof .muted{margin:8px 0 0}
.avs{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:12px}.avb{border-radius:50%;padding:3px;border:3px solid transparent;display:grid}.avb .av{width:100%;height:auto;aspect-ratio:1;font-size:1.5rem}.avb.on{border-color:var(--accent)}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.ac{display:flex;flex-direction:column;align-items:center;text-align:center;padding:14px 8px;border-radius:16px;border:1px solid var(--line);background:var(--bg);opacity:.5}.ac span{font-size:1.8rem}.ac small{color:var(--muted)}
.ac.on{opacity:1;border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c)}
#toasts{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;z-index:60;display:flex;flex-direction:column;gap:8px;max-width:min(360px,calc(100vw - 24px))}
.toast{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:14px;padding:12px 14px;box-shadow:0 12px 30px -12px rgba(0,0,0,.4);animation:rise .35s}.toast>span{font-size:1.5rem}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.5);display:grid;place-items:center;padding:16px}
.modal .box{background:var(--surface);border-radius:22px;max-width:560px;width:100%;max-height:86vh;overflow:auto;padding:22px;animation:pop .3s}
.gl{padding-left:20px;margin:0 0 8px}.gl li{margin-bottom:6px}
/* ===== Efek foto profil (naik seiring pencapaian) ===== */
@keyframes spin{to{transform:rotate(1turn)}}
@keyframes aura{0%,100%{box-shadow:0 0 calc(var(--t)*2) 0 var(--c1)}50%{box-shadow:0 0 calc(var(--t)*4.5) calc(var(--t)*.6) var(--c1)}}
@keyframes bob{50%{transform:translateX(-50%) translateY(-3px) rotate(-10deg)}}
.av.md{width:52px;height:52px;font-size:1.6rem}
.avw{--sz:32px;--t:3px;position:relative;display:inline-grid;flex:none;border-radius:50%;isolation:isolate}
.avw.md{--sz:52px;--t:4px}.avw.lg{--sz:84px;--t:5px}
.avw::before{content:'';position:absolute;inset:calc(var(--t)*-1);border-radius:50%;z-index:-1;background:var(--c1)}
.avw.t2::before,.avw.t3::before,.avw.t4::before{background:conic-gradient(var(--c1),var(--c2),var(--c1));animation:spin 4s linear infinite}
.avw.t2,.avw.t3,.avw.t4{animation:aura 2.4s ease-in-out infinite}
.avw.fx4::before{background:conic-gradient(#C5DA2B,#2BA3E6,#A94BC0,#F5A31A,#C5DA2B)}
.avw.t3::before{animation-duration:2.6s}.avw.t3{animation-duration:2s}
.avw.t3::after,.avw.t4::after{content:'';position:absolute;inset:calc(var(--t)*-1);border-radius:50%;z-index:2;pointer-events:none;background:radial-gradient(circle at 50% calc(var(--t)*.5),#fff 0 calc(var(--t)*.5),transparent calc(var(--t)*.65));filter:drop-shadow(0 0 2px #fff);animation:spin 2.4s linear infinite}
.avw.t4::before{background:conic-gradient(#FFF3B0,#F2B705,#B8860B,#F2B705,#FFF3B0);animation-duration:2s}
.avw.t4{animation-duration:1.6s}
.avw.t4::after{background:radial-gradient(circle at 50% calc(var(--t)*.5),#fff 0 calc(var(--t)*.5),transparent calc(var(--t)*.65)),radial-gradient(circle at 50% calc(100% - var(--t)*.5),#fff 0 calc(var(--t)*.5),transparent calc(var(--t)*.65));animation-duration:3s}
.crn{position:absolute;left:50%;top:calc(var(--sz)*-.4);transform:translateX(-50%) rotate(-10deg);font-style:normal;font-size:calc(var(--sz)*.46);line-height:1;z-index:3;pointer-events:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35));animation:bob 2s ease-in-out infinite}
.fxg{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.fxi{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:22px 8px 12px;border-radius:16px;border:1px solid var(--line);background:var(--bg);opacity:.5}
.fxi.on{opacity:1}.fxi.cur{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}.fxi small{color:var(--muted)}
/* ===== Pilih efek bingkai ===== */
button.fxi{font:inherit;color:inherit;cursor:pointer;width:100%}button.fxi:disabled{cursor:not-allowed}button.fxi:not(:disabled):hover{border-color:var(--accent)}
/* ===== Api untuk peringkat 1 ===== */
@keyframes blaze{0%,100%{box-shadow:0 0 8px 2px #ff6a00,0 0 18px 6px rgba(255,60,0,.55)}50%{box-shadow:0 0 12px 4px #ffb300,0 0 28px 10px rgba(255,80,0,.75)}}
@keyframes flick{0%,100%{transform:scale(1,1) rotate(-5deg)}30%{transform:scale(1.15,1.4) rotate(4deg)}60%{transform:scale(.9,1.1) rotate(-3deg)}}
@keyframes flametxt{to{background-position:200% 0}}
.fire{position:relative;display:inline-grid;flex:none;border-radius:50%;isolation:isolate;animation:blaze 1s ease-in-out infinite}
.fl{position:absolute;font-style:normal;line-height:1;font-size:calc(var(--sz)*.62);z-index:-1;pointer-events:none;transform-origin:50% 90%;filter:drop-shadow(0 0 4px #ff6a00);animation:flick .7s ease-in-out infinite}
.fl.f1{left:-14%;top:-26%;animation-delay:-.2s}.fl.f2{left:50%;top:-44%;margin-left:calc(var(--sz)*-.31);animation-delay:-.45s}.fl.f3{right:-14%;top:-26%;animation-delay:-.1s}
.lrow.top1{background:linear-gradient(90deg,rgba(255,110,0,.24),rgba(255,190,0,.08));border-radius:12px;box-shadow:inset 0 0 0 1px rgba(255,120,0,.5)}
.lrow.top1 .un>span:last-child{background:linear-gradient(90deg,#ff3d00,#ffb300,#ff3d00);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800;animation:flametxt 2s linear infinite}
/* ===== Nilai quest & kelola soal ===== */
select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px;width:100%;margin-bottom:10px}textarea{resize:vertical}
.lvl .gr{font-weight:800}
.gtag{display:inline-block;font-weight:800;padding:2px 14px;border-radius:999px;color:#1a1a1a;margin:0 0 10px}
.qrow{align-items:flex-start}.qrow .chk{margin:4px 0 0}.qrow .btn{flex:none;padding:8px 16px}

<body>
<div id="toasts"></div>
<div class="app" id="app">
  <aside class="side">
    <div class="brand"><img src="/logo.png" alt="Al-Miftah – Mudah Belajar Membaca Kitab"></div>
    <button class="nav" data-v="home">Beranda</button>
    <button class="nav" data-v="board">Leaderboard</button>
    <button class="nav" data-v="admin" id="navAdmin" hidden>Panel Admin</button>
    <div class="sp"></div>
    <button class="nav" data-v="profile" id="who"></button>
    <button class="nav" id="guideBtn">Panduan</button>
    <button class="nav" id="theme">Ganti tema</button>
    <button class="nav" id="out">Keluar</button>
    <div class="credit">Powered by<br><b>Nabil Ghufron</b> 1447-1448 H</div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <main class="main">
    <header class="top"><button class="icon-btn" id="menu" aria-label="Menu"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button><img class="top-logo" src="/logo.png" alt="Al-Miftah – Mudah Belajar Membaca Kitab"></header>
    <div class="scroll"><div class="wrap" id="view"></div><div class="credit">Powered by <b>Nabil Ghufron</b> 1447-1448 H</div></div>
  </main>
</div>
<script>
const $ = s => document.querySelector(s), V = $('#view');
const LV = { easy: ['Mudah', 10, 100, '🌱', 'e'], medium: ['Sedang', 20, 200, '⚡', 'm'], hard: ['Sulit', 30, 300, '🔥', 'h'] };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let tok = null, me = null;
try { tok = localStorage.getItem('tk'); } catch (e) {}

async function api(p, b) {
  const r = await fetch('/api/' + p, {
    method: b ? 'POST' : 'GET',
    headers: { 'Content-Type': 'application/json', ...(tok ? { Authorization: 'Bearer ' + tok } : {}) },
    body: b ? JSON.stringify(b) : undefined
  });
  const d = await r.json().catch(() => ({}));
  if (r.status === 401 && tok && p !== 'login' && p !== 'register') { tok = null; try { localStorage.removeItem('tk'); } catch (e) {} setTimeout(boot, 0); }
  if (!r.ok) throw new Error(d.error || 'Terjadi kesalahan');
  return d;
}
const closeMenu = () => $('#app').classList.remove('open');
function go(v, a) {
  closeMenu(); if (me) renderChip();
  document.querySelectorAll('.nav[data-v]').forEach(b => b.classList.toggle('active', b.dataset.v === v));
  ({ auth: vAuth, home: vHome, board: vBoard, admin: vAdmin, profile: vProfile })[v](a);
  $('.scroll').scrollTop = 0;
}

/* ---------- Masuk / Daftar ---------- */
function vAuth() {
  let mode = 'login';
  V.innerHTML = `<div class="card auth"><img class="auth-logo" src="/logo.png" alt="Al-Miftah – Mudah Belajar Membaca Kitab"><p class="muted" style="text-align:center">Kuis nahwu untuk murid Madrasah Idadiyah.</p>
    <div class="tabs"><button data-m="login" class="on">Masuk</button><button data-m="reg">Daftar</button></div>
    <input id="u" placeholder="Username" autocomplete="username"><input id="p" type="password" placeholder="Password" autocomplete="current-password">
    <div class="err" id="err"></div><button class="btn" id="go">Masuk</button></div>`;
  V.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
    mode = b.dataset.m;
    V.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
    $('#go').textContent = mode === 'login' ? 'Masuk' : 'Daftar';
  });
  const submit = async () => {
    try {
      const d = await api(mode === 'login' ? 'login' : 'register', { username: $('#u').value.trim(), password: $('#p').value });
      tok = d.token; try { localStorage.setItem('tk', tok); } catch (e) {}
      await boot();
    } catch (e) { $('#err').textContent = e.message; }
  };
  $('#go').onclick = submit;
  $('#p').onkeydown = e => { if (e.key === 'Enter') submit(); };
}

/* ---------- Efek ---------- */
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
/* Perangkat lawas: pulsa cahaya (box-shadow beranimasi) dimatikan, cincin berputar tetap jalan */
if ((navigator.deviceMemory && navigator.deviceMemory <= 2) || (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 4 && /Android|Mobi/i.test(navigator.userAgent))) document.documentElement.classList.add('lite');
const pick = a => a[Math.floor(Math.random() * a.length)];
let tt;
function typeIt(el, text) {
  clearInterval(tt);
  if (RM) { el.textContent = text; return; }
  let i = 0; const dt = Math.max(8, Math.min(28, 1800 / text.length));
  el.classList.add('cur');
  tt = setInterval(() => { el.textContent = text.slice(0, ++i); if (i >= text.length) { clearInterval(tt); el.classList.remove('cur'); } }, dt);
}
function count(el, to, ms = 900) {
  if (RM) { el.textContent = to; return; }
  const t0 = performance.now();
  const f = t => { const p = Math.min((t - t0) / ms, 1); el.textContent = Math.round(to * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(f); };
  requestAnimationFrame(f);
}
function burst(x, y, n = 14) {
  if (RM) return;
  const cs = ['#2EAD5C', '#F5A623', '#EF5B5B', '#4C9AFF', '#F5C518'];
  for (let i = 0; i < n; i++) {
    const p = document.createElement('i'), a = Math.random() * 6.28, d = 60 + Math.random() * 130;
    p.className = 'pt';
    p.style.cssText = `left:${x}px;top:${y}px;background:${cs[i % 5]};--x:${Math.cos(a) * d}px;--y:${Math.sin(a) * d + 50}px;--r:${Math.random() * 720}deg`;
    document.body.appendChild(p); setTimeout(() => p.remove(), 1000);
  }
}

/* ---------- Beranda ---------- */
const JC = { 1: ['#C5DA2B', '#6F8A0A', '#1b2400'], 2: ['#2BA3E6', '#0E5C9C', '#04263f'], 3: ['#A94BC0', '#6A2A94', '#2a0a36'], 4: ['#F5A31A', '#B85C00', '#2b1500'] };
const jst = j => `--c:${JC[j][0]};--d:${JC[j][1]};--fg:${JC[j][2]}`;
/* Quest selesai = level yang mencapai batas lulus (aturan persennya ada di server: PASS_PCT). Jilid selesai = 3 level selesai. Tathbiq terbuka = 4 jilid selesai. */
const PASS = () => me.pass || 60;
const qd = (j, k) => (me.best[j + ':' + k] || 0) >= LV[k][2] * PASS() / 100;
/* Nilai quest dari persentase benar: Sempurna 100 · Mumtaz 90+ · Jayyid 75+ · Lulus (batas lulus, 60) */
const GR = p => p >= 100 ? ['Sempurna', '💯', '#F2B705'] : p >= 90 ? ['Mumtaz', '🌟', '#2EAD5C'] : p >= 75 ? ['Jayyid', '👍', '#2BA3E6'] : p >= PASS() ? ['Lulus', '✅', '#9AA5B1'] : null;
const pct = (j, k) => Math.round((me.best[j + ':' + k] || 0) / LV[k][2] * 100);
const grOf = (j, k) => qd(j, k) ? GR(Math.max(pct(j, k), PASS())) : null;
const JP = j => Object.keys(LV).every(k => pct(j, k) >= 100);
/* Admin: semua fitur terbuka (Tathbiq, seluruh efek foto, seluruh pencapaian) */
const ADM = () => !!me && me.role === 'admin';
const AJD = j => ADM() || JD(j), TS = () => ADM() ? 7 : (me.tstage || 0);
const JN = j => Object.keys(LV).filter(k => qd(j, k)).length, JD = j => JN(j) === 3, TAT = () => ADM() || [1, 2, 3, 4].every(JD);
const RANKS = [[0, 'Bronze', '🥉', '#CD7F32'], [300, 'Silver', '🥈', '#B8C2CC'], [700, 'Gold', '🥇', '#F2B705'], [1200, 'Platinum', '🛡️', '#46C2B5'], [1800, 'Diamond', '💎', '#3AA9F0']];
const rkOf = t => RANKS.reduce((a, r, n) => t >= r[0] ? n : a, 0), totalXp = () => Object.values(me.best).reduce((a, b) => a + b, 0);
function noteRank(t0) { const a = rkOf(t0), b = rkOf(totalXp()); if (b > a) setTimeout(() => toast(`Pencapaian baru: <b>${RANKS[b][2]} ${RANKS[b][1]}</b>! Rankmu naik.`, RANKS[b][2]), 500); }
function vHome() {
  const tot = Object.values(me.best).reduce((a, b) => a + b, 0);
  const ri = RANKS.reduce((a, r, n) => tot >= r[0] ? n : a, 0), nx = RANKS[ri + 1];
  V.innerHTML = `<h1>Assalamu'alaikum, ${esc(me.username)}</h1>
    <div class="card"><span class="tag" style="background:${RANKS[ri][3]};color:#1a1a1a">${RANKS[ri][2]} ${RANKS[ri][1]}</span><h1><span id="tx">0</span> XP</h1><div class="prog"><i id="pg"></i></div>
    <p class="muted" style="margin:8px 0 0">${nx ? (nx[0] - tot) + ' XP lagi menuju ' + nx[1] : 'Tingkat tertinggi tercapai!'}</p></div>
    <div class="card" style="--i:2"><h2>Tingkatan rank</h2><div class="ranks">${RANKS.map((r, n) => `<div class="rnk ${n < ri ? 'done' : n === ri ? 'cur' : 'lock'}" style="--rc:${r[3]}"><span class="dot">${n <= ri ? r[2] : '🔒'}</span><b>${r[1]}</b><small>${r[0]} XP</small></div>`).join('')}</div></div>
    <div class="card endless" style="--i:3"><div><span class="tag">${TAT() ? '📚' : '🔒'} Mode Tathbiq</span><h2>Soal acak dari semua jilid</h2>${TAT() ? `<p>3 nyawa. Naik tahap tiap 10 soal: Tathbiq 1 sampai 6, lalu Takhossus. XP tanpa batas!</p><small>Rekor: ${me.best['0:endless'] || 0} XP · Tahap tertinggi: ${me.tstage ? STG[me.tstage - 1][0] : '-'}</small>` : `<p>Terkunci. Selesaikan semua quest Jilid 1–4 (minimal ${PASS()}% benar di tiap level) untuk membuka mode ini.</p><small>Jilid selesai: ${[1, 2, 3, 4].filter(JD).length}/4</small>`}</div><button class="btn" id="endStart"${TAT() ? '' : ' disabled'}>${TAT() ? 'Mulai' : '🔒 Terkunci'}</button></div>
    <div class="grid">` + [1, 2, 3, 4].map((j, n) => `<div class="card jc" style="--i:${n + 1};${jst(j)}"><span class="tag">Jilid ${j}${JD(j) ? (JP(j) ? ' 💯' : ' 🏅') : ' · ' + JN(j) + '/3'}</span><div class="lvls">` +
      Object.entries(LV).map(([k, [nm, c, x, ic, cl]]) => {
        const b = me.best[j + ':' + k] || 0;
        return `<button class="lvl ${cl}" data-j="${j}" data-l="${k}"><span class="ic">${ic}</span><b>${nm}</b><small>${c} soal${grOf(j, k) ? ' · <span class="gr">' + grOf(j, k)[0] + '</span>' : ''}</small><span class="xp">${b}/${x} XP</span><i class="pb"><u style="width:${b / x * 100}%"></u></i>${grOf(j, k) ? '<span class="done" title="' + grOf(j, k)[0] + '">' + grOf(j, k)[1] + '</span>' : ''}</button>`;
      }).join('') + `</div></div>`).join('') + `</div>`;
  count($('#tx'), tot);
  $('#endStart').onclick = async () => { try { vEndless(await api('endless/start', {})); } catch (e) { alert(e.message); } };
  setTimeout(() => { $('#pg').style.background = RANKS[ri][3]; $('#pg').style.width = (nx ? (tot - RANKS[ri][0]) / (nx[0] - RANKS[ri][0]) * 100 : 100) + '%'; }, 80);
  V.querySelectorAll('.lvl').forEach(b => b.onclick = async () => {
    try { vQuiz(await api(`quiz?jilid=${b.dataset.j}&level=${b.dataset.l}`), +b.dataset.j, b.dataset.l); }
    catch (e) { alert(e.message); }
  });
}

/* ---------- Kuis ---------- */
function vQuiz(d, j, l) {
  const qs = d.questions, wrong = []; let i = 0, streak = 0;
  const draw = () => {
    const q = qs[i];
    V.innerHTML = `<div class="card jc" style="${jst(j)}"><div class="bar"><i style="width:${i / qs.length * 100}%"></i></div>
      <div class="meta"><span class="muted">Jilid ${j} · ${LV[l][0]} · Soal ${i + 1}/${qs.length}</span><span class="chip" id="cb">🔥 ${streak}</span></div>
      <h2 dir="auto" id="qt"></h2><div>` +
      ['a', 'b', 'c', 'd'].map((k, n) => `<button class="opt" style="--i:${n}" data-k="${k.toUpperCase()}" dir="auto"><b>${k.toUpperCase()}</b><span>${esc(q[k])}</span></button>`).join('') +
      `</div><div id="fb"></div><div class="row"><span></span><button class="btn" id="nx" hidden>${i < qs.length - 1 ? 'Berikutnya →' : 'Lihat hasil'}</button></div></div>`;
    const h = $('#qt'), all = V.querySelectorAll('.opt');
    typeIt(h, q.q);
    h.onclick = () => { clearInterval(tt); h.textContent = q.q; h.classList.remove('cur'); };
    all.forEach(b => b.onclick = async () => {
      all.forEach(x => x.disabled = true);
      try {
        const r = await api('check', { token: d.token, id: q.id, choice: b.dataset.k });
        clearInterval(tt); h.textContent = q.q; h.classList.remove('cur');
        [...all].find(x => x.dataset.k === r.answer).classList.add('ok');
        if (r.ok) { streak++; const bb = b.getBoundingClientRect(); burst(bb.left + bb.width / 2, bb.top + bb.height / 2, 18); }
        else { b.classList.add('no'); streak = 0; wrong.push({ q: q.q, a: q[r.answer.toLowerCase()], k: r.answer }); }
        const cb = $('#cb'); cb.textContent = '🔥 ' + streak; cb.classList.add('pop');
        $('#fb').innerHTML = r.ok
          ? `<div class="fb ok">${pick(['Benar!', 'Masya Allah, tepat!', 'Barakallahu fiik!'])}${streak > 2 ? ' ' + streak + ' beruntun!' : ''}</div>`
          : `<div class="fb no">Belum tepat. Jawaban yang benar: ${r.answer}</div>`;
        $('#nx').hidden = false; $('#nx').focus();
      } catch (e) { alert(e.message); all.forEach(x => x.disabled = false); }
    });
    $('#nx').onclick = async () => {
      if (i < qs.length - 1) { i++; draw(); return; }
      try { vResult(await api('submit', { token: d.token }), j, l, wrong); } catch (e) { alert(e.message); }
    };
  };
  draw();
}
function vResult(r, j, l, wrong) {
  const k = j + ':' + l, prev = me.best[k] || 0, gain = Math.max(0, r.xp - prev);
  const wasJ = JD(j), wasT = TAT();
  const t0 = totalXp();
  me.best[k] = Math.max(prev, r.xp); noteRank(t0);
  if (!wasJ && JD(j)) toast(`Pencapaian baru: <b>Jilid ${j}</b> selesai!`, '🏅');
  if (!wasT && TAT()) setTimeout(() => toast('<b>Mode Tathbiq terbuka!</b> Semua quest Jilid 1–4 sudah selesai.', '🔓'), 900);
  const em = r.score >= 90 ? '🏆' : r.score >= 70 ? '🎉' : r.score >= 40 ? '👍' : '💪';
  V.innerHTML = `<div class="card res jc" style="${jst(j)}"><div class="big">${em}</div><span class="tag">Hasil · Jilid ${j} · ${LV[l][0]}</span>
    <h1><span id="rx">0</span> / ${LV[l][2]} XP</h1><p class="muted">${r.correct} dari ${r.total} soal benar · nilai ${r.score}</p>
    ${GR(r.score) ? `<span class="gtag" style="background:${GR(r.score)[2]}">${GR(r.score)[1]} ${GR(r.score)[0]} · quest selesai</span>` : `<p class="muted">Belum lulus. Butuh minimal ${PASS()}% benar agar quest ini selesai.</p>`}
    <span class="chip pop">${gain ? '+' + gain + ' XP masuk ke totalmu' : 'Rekor di level ini: ' + prev + ' XP. Lampaui untuk menambah total.'}</span>
    <div class="row"><button class="btn" id="hm">Kembali</button><button class="btn ghost" id="lb">Lihat leaderboard</button></div></div>` +
    (wrong.length ? `<h2>Pembahasan (${wrong.length} salah)</h2>` + wrong.map((w, n) => `<div class="card" style="--i:${n}"><p dir="auto"><b>${esc(w.q)}</b></p><p class="muted" dir="auto">Jawaban benar: ${w.k}. ${esc(w.a)}</p></div>`).join('') : '');
  count($('#rx'), r.xp);
  if (r.score >= 70) [0, 250, 500].forEach(t => setTimeout(() => burst(innerWidth / 2, 130, 36), t));
  $('#hm').onclick = () => go('home'); $('#lb').onclick = () => go('board');
}

/* ---------- Endless ---------- */
function vEndless(d) {
  const run = d.run; noteStage(d.n); let q = d.question, n = d.n, lives = 3, score = 0, correct = 0, answered = 0;
  const hearts = () => '❤️'.repeat(lives) + '🖤'.repeat(3 - lives);
  const draw = () => {
    V.innerHTML = `<div class="card end"><div class="meta"><span class="chip" id="hp">${hearts()}</span><span class="chip" id="sc">⭐ ${score}</span></div>
      <p class="muted"><span class="chip" style="${stgStyle(n)}">${stg(n)[0]}</span> Soal #${n} · benar = +${10 * Math.ceil(n / 10)} XP</p><h2 dir="auto" id="qt"></h2><div>` +
      ['a', 'b', 'c', 'd'].map((k, i) => `<button class="opt" style="--i:${i}" data-k="${k.toUpperCase()}" dir="auto"><b>${k.toUpperCase()}</b><span>${esc(q[k])}</span></button>`).join('') +
      `</div><div id="fb"></div><div class="row"><button class="btn ghost" id="st">Berhenti</button><button class="btn" id="nx" hidden>Lanjut →</button></div></div>`;
    const h = $('#qt'), all = V.querySelectorAll('.opt'), text = q.q;
    typeIt(h, text);
    h.onclick = () => { clearInterval(tt); h.textContent = text; h.classList.remove('cur'); };
    $('#st').onclick = () => vEndResult({ score, correct, answered });
    all.forEach(b => b.onclick = async () => {
      all.forEach(x => x.disabled = true); $('#st').disabled = true;
      try {
        const r = await api('endless/answer', { run, choice: b.dataset.k });
        clearInterval(tt); h.textContent = text; h.classList.remove('cur');
        [...all].find(x => x.dataset.k === r.answer).classList.add('ok');
        lives = r.lives; score = r.score; correct = r.correct; answered++;
        if (r.ok) { const bb = b.getBoundingClientRect(); burst(bb.left + bb.width / 2, bb.top + bb.height / 2, 18); $('#sc').classList.add('pop'); }
        else { b.classList.add('no'); $('#hp').classList.add('shk'); }
        $('#hp').textContent = hearts(); $('#sc').textContent = '⭐ ' + score;
        $('#fb').innerHTML = r.ok ? `<div class="fb ok">${pick(['Benar!', 'Masya Allah, tepat!', 'Barakallahu fiik!'])} +${r.pts} XP</div>`
          : `<div class="fb no">Nyawa berkurang. Jawaban yang benar: ${r.answer}</div>`;
        const nx = $('#nx'); nx.hidden = false; nx.textContent = r.over ? 'Lihat hasil' : 'Lanjut →'; nx.focus();
        nx.onclick = () => { if (r.over) vEndResult({ score, correct, answered, cleared: r.cleared }); else { q = r.next; n++; noteStage(n); draw(); } };
      } catch (e) { alert(e.message); all.forEach(x => x.disabled = false); $('#st').disabled = false; }
    });
  };
  draw();
}
function vEndResult(r) {
  const prev = me.best['0:endless'] || 0, gain = Math.max(0, r.score - prev);
  const t0 = totalXp();
  me.best['0:endless'] = Math.max(prev, r.score); noteRank(t0);
  V.innerHTML = `<div class="card res"><div class="big">${gain ? '🏆' : '🏁'}</div><span class="tag">Hasil Tathbiq</span>
    <h1><span id="rx">0</span> XP</h1><p class="muted">${r.correct} benar dari ${r.answered} soal${r.cleared ? ' · semua soal berhasil dijawab!' : ''}</p>
    <span class="chip pop">${gain ? '+' + gain + ' XP masuk ke totalmu (rekor baru!)' : 'Rekor Tathbiq-mu: ' + prev + ' XP. Lampaui untuk menambah total.'}</span>
    <div class="row"><button class="btn" id="hm">Kembali</button><button class="btn ghost" id="lb">Lihat leaderboard</button></div></div>`;
  count($('#rx'), r.score);
  if (gain) [0, 250, 500].forEach(t => setTimeout(() => burst(innerWidth / 2, 130, 36), t));
  $('#hm').onclick = () => go('home'); $('#lb').onclick = () => go('board');
}

/* ---------- Profil, notifikasi, panduan ---------- */
const AVS = [['🦁', '#F5A31A'], ['🦅', '#2BA3E6'], ['🐪', '#D2A15B'], ['🐢', '#2EAD5C'], ['🦉', '#A94BC0'], ['🐬', '#3AA9F0'], ['🦊', '#EF7B3B'], ['🐼', '#9AA5B1'], ['🌙', '#4B4FB3'], ['📖', '#1A7A3C'], ['🕌', '#46C2B5'], ['⭐', '#F2B705']];
/* Efek foto: level efek = jumlah pencapaian (0-11). Tier 1: cincin (1-3) · 2: cincin berputar + cahaya (4-6) · 3: + titik mengorbit (7-10) · 4: emas + mahkota (11, Takhossus) */
const FXC = [['#2EAD5C', '#2EAD5C'], ['#2BA3E6', '#2BA3E6'], ['#A94BC0', '#A94BC0'], ['#F5A31A', '#C5DA2B'], ['#22A052', '#7CFFA8'], ['#2B8FE0', '#7CD3FF'], ['#A44FD0', '#E0A0FF'], ['#F08A1E', '#FFD27A'], ['#E24B3B', '#FF9A8A'], ['#E0367A', '#FF8FC0'], ['#F2B705', '#FFF3B0']];
const fxTier = n => n < 4 ? 1 : n < 7 ? 2 : n < 11 ? 3 : 4;
const avBase = (k, sz = '', fx = 0) => {
  const a = AVS[(parseInt(String(k || 'a1').slice(1)) - 1) || 0], e = `<span class="av ${sz}" style="background:${a[1]}">${a[0]}</span>`;
  if (!(fx > 0)) return e;
  const n = Math.min(fx, 11), f = FXC[n - 1];

    const ids = sel(); if (!ids.length) return;
    if (!confirm(`Hapus ${ids.length} soal terpilih? Tindakan ini tidak bisa dibatalkan.`)) return;
    try { await api('admin/question-delete', { ids }); toast(ids.length + ' soal dihapus', '🗑️'); load(); refreshStats(); } catch (e) { alert(e.message); }
  };
  load();
}

function adminUsers() {
  V.insertAdjacentHTML('beforeend', `<div class="card"><h2>Kelola murid</h2><input type="search" id="uq" placeholder="Cari username…" autocomplete="off"><div id="ul" class="muted">Memuat…</div></div>`);
  let t, seq = 0;
  const load = async () => {
    const my = ++seq;
    try {
      const d = await api('admin/users?q=' + encodeURIComponent($('#uq').value.trim()));
      if (my !== seq) return;
      $('#ul').innerHTML = (d.users.length ? d.users.map(x => `<div class="urow"><div><b>${esc(x.username)}</b>${x.role === 'admin' ? ' <span class="chip">admin</span>' : ''}<div class="muted" style="margin:0;font-size:.85rem">${x.xp} XP · ${x.attempts} percobaan</div></div>${x.role === 'admin' ? '' : `<button class="btn ghost del" data-id="${x.id}" data-n="${esc(x.username)}">Hapus</button>`}</div>`).join('') : 'Tidak ada murid ditemukan.') +
        (d.total > d.users.length ? `<p class="muted">Menampilkan ${d.users.length} dari ${d.total}. Gunakan pencarian.</p>` : '');
      $('#ul').querySelectorAll('.del').forEach(b => b.onclick = async () => {
        if (!confirm(`Hapus akun "${b.dataset.n}" beserta semua nilainya? Tindakan ini tidak bisa dibatalkan.`)) return;
        try { await api('admin/delete-user', { id: +b.dataset.id }); load(); } catch (e) { alert(e.message); }
      });
    } catch (e) { $('#ul').textContent = e.message; }
  };
  $('#uq').oninput = () => { clearTimeout(t); t = setTimeout(load, 250); };
  load();
}

/* ---------- Awal ---------- */
async function boot() {
  try { me = await api('me'); } catch (e) { tok = null; me = null; try { localStorage.removeItem('tk'); } catch (x) {} }
  document.body.classList.toggle('anon', !me);
  if (me) { renderChip(); $('#navAdmin').hidden = me.role !== 'admin'; go('home'); try { if (!localStorage.getItem('guide1')) { localStorage.setItem('guide1', '1'); openGuide(); } } catch (e) {} } else go('auth');
}
document.querySelectorAll('.nav[data-v]').forEach(b => b.onclick = () => go(b.dataset.v));
$('#guideBtn').onclick = () => { closeMenu(); openGuide(); };
$('#out').onclick = () => { tok = null; try { localStorage.removeItem('tk'); } catch (e) {} boot(); };
$('#menu').onclick = () => $('#app').classList.add('open'); $('#scrim').onclick = closeMenu;
function theme(t) { document.documentElement.setAttribute('data-theme', t); try { localStorage.setItem('theme', t); } catch (e) {} }
$('#theme').onclick = () => theme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
try { const t = localStorage.getItem('theme'); if (t) theme(t); } catch (e) {}
boot();
</script>
